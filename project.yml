name: GamerAgent
options:
  bundleIdPrefix: com.gameragent
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_NAME: GamerAgent
    ENABLE_HARDENED_RUNTIME: YES

targets:
  GamerAgent:
    type: application
    platform: macOS
    sources:
      - path: GamerAgent
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: GamerAgent/Info.plist
        CODE_SIGN_ENTITLEMENTS: GamerAgent/GamerAgent.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.gameragent.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: GamerAgent/GamerAgent.entitlements
