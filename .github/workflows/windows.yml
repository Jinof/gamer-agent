name: Windows checks

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/windows.yml"
  pull_request:

jobs:
  check-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: gamer-agent-windows-x64
          path: dist/*.exe
